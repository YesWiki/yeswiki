      mail:
        label: _t(AB_abonnement_action_mail_label)
        type: email
        value: my@mailing.list
        required: true
      mailinglist:
        label: _t(AB_abonnement_mailinglist_label)
        type: list
        options:
          - sympa
          - ezmlm
      nbactionmail:
        label: _t(AB_abonnement_template_label)
        type: text
        advanced: true
      class:
        label: _t(AB_abonnement_class_label)
        type: text
        advanced: true
  unsubscribe:
    label: _t(AB_deabonnement_action_label)
    properties:
      mail:
        label: _t(AB_abonnement_action_mail_label)
        type: email
        value: my@mailing.list
        required: true
      mailinglist:
        label: _t(AB_abonnement_mailinglist_label)
        type: list
        options:
          - sympa
          - ezmlm
      nbactionmail:
        label: _t(AB_abonnement_template_label)
        type: text
        advanced: true
      class:
        label: _t(AB_abonnement_class_label)
        type: text
        advanced: true
