services:
  _defaults:
    autowire: true
    public: true

  # Manually set inside the initCoreService method
  # Allow to imitate Symfony https://symfony.com/doc/current/service_container/synthetic_services.html
  Symfony\Component\DependencyInjection\ParameterBag\ParameterBagInterface:
    synthetic: true

  # Manually set inside the initCoreService method
  Symfony\Component\Security\Csrf\CsrfTokenManager:
    synthetic: true

  # Manually set at boot (see YesWikiRuntime::boot())
  YesWiki\YesWikiRuntime:
    synthetic: true

  # Ticket 06: actions and handlers that have become real services tag themselves by
  # implementing RegisteredPerformable; YesWikiPerformableCompilerPass turns the tags into
  # ActionRegistry's name => service-id map.
  _instanceof:
    YesWiki\Kernel\Performable\RegisteredAction:
      tags: ['yeswiki.action']
    YesWiki\Kernel\Performable\RegisteredHandler:
      tags: ['yeswiki.handler']
    # Ticket 36: whatever declares what the editor's palette can insert. Tagged the same
    # way an action is, so a provider enrols by implementing the interface and nothing else
    # -- there is no list of providers anywhere, which is the point.
    YesWiki\Kernel\Component\ProvidesComponents:
      tags: ['yeswiki.component_provider']
    # Ticket 37: an action that supplies Items for a Presentation to render. Tagged the same
    # way, so adding a Source is a change to that action and nothing else.
    YesWiki\Content\Entity\SuppliesItems:
      tags: ['yeswiki.item_source']
    # Ticket 39: what another module can say about an entry, and what it can add to the bottom
    # of a page. Both are the view asking each module for its part, rather than Content
    # reaching into the features layered over it (ADR-0019).
    YesWiki\Content\Entity\ContributesEntryFields:
      tags: ['yeswiki.entry_fields']
    YesWiki\Content\Entity\AppendsToPageView:
      tags: ['yeswiki.page_view_appendix']

  YesWiki\Kernel\Performable\ActionRegistry:
    arguments:
      $container: '@service_container'
      $map: []

  # Allow autowiring services that need the container itself (e.g. to fetch a
  # service lazily and break a circular dependency), matching Symfony's own
  # convention of aliasing the PSR container interface to service_container.
  Psr\Container\ContainerInterface: '@service_container'

  # Wave-two ticket 05: modules migrate to Composer PSR-4 one at a time. A module's
  # namespace maps to its own directory (YesWiki\Search\Service\X -> src/Search/Service/X.php),
  # which is what PSR-4 requires and what the flat services/ + controllers/ layout could
  # never satisfy. YesWiki\Core\* below keeps its bespoke loader until every module has moved.
  # Module resources are scoped to the layers that actually contain services. Registering a
  # whole module ('Render/*') pulls in entities, exceptions, value objects and hand-built
  # extensions, none of which autowire -- Symfony fails on the first scalar or callable
  # constructor argument. Naming the layers avoids an ever-growing exclude list.
  YesWiki\Kernel\Service\:
    resource: 'Kernel/Service/*'
    exclude:
      # a value object constructed with `new` -- its constructor takes the items to
      # paginate, so autowiring it fails
      - 'Kernel/Service/Paginator.php'

  YesWiki\Search\Service\:
    resource: 'Search/Service/*'

  YesWiki\Search\Action\:
    resource: 'Search/Action/*'

  YesWiki\Search\Controller\:
    resource: 'Search/Controller/*'

  YesWiki\Render\Component\:
    resource: 'Render/Component/*'

  # ...and the two registries in there that take a tagged iterator, which nothing can guess.
  # Declared AFTER the resource above on purpose: a resource definition replaces whatever it
  # matched, so these arguments have to be the last word or they are silently dropped.
  YesWiki\Render\Component\SourceRegistry:
    arguments:
      $sourceServices: !tagged_iterator yeswiki.item_source

  YesWiki\Render\Component\ComponentRegistry:
    arguments:
      # Iterating instantiates every provider, which for an action means the action too.
      # That is an edit-screen cost only: nothing asks for the palette while rendering a
      # page, and the result is memoised for the request that did ask.
      $providers: !tagged_iterator yeswiki.component_provider
      $container: '@service_container'


  YesWiki\Render\Service\:
    resource: 'Render/Service/*'

  YesWiki\Render\Action\:
    resource: 'Render/Action/*'

  YesWiki\Render\Handler\:
    resource: 'Render/Handler/*'

  YesWiki\Identity\Service\:
    resource: 'Identity/Service/*'

  YesWiki\Identity\Controller\:
    resource: 'Identity/Controller/*'

  YesWiki\Identity\Action\:
    resource: 'Identity/Action/*'

  YesWiki\Identity\Handler\:
    resource: 'Identity/Handler/*'

  YesWiki\Content\Service\:
    resource: 'Content/Service/*'

  YesWiki\Content\Controller\:
    resource: 'Content/Controller/*'

  YesWiki\Content\Action\:
    resource: 'Content/Action/*'

  YesWiki\Content\Handler\:
    resource: 'Content/Handler/*'

  YesWiki\Admin\Service\:
    resource: 'Admin/Service/*'

  YesWiki\Admin\Action\:
    resource: 'Admin/Action/*'

  YesWiki\Admin\Handler\:
    resource: 'Admin/Handler/*'

  YesWiki\Admin\Controller\:
    resource: 'Admin/Controller/*'
    # the web installer runs before the container exists (no config file, no database)
    exclude: 'Admin/Controller/InstallationController.php'

  # /api/* resource controllers (ticket 08 ApiController split); registered like other
  # controllers so tests and services can fetch them from the container
  YesWiki\Identity\Api\:
    resource: 'Identity/Api/*'

  YesWiki\Content\Api\:
    resource: 'Content/Api/*'

  YesWiki\Import\Service\:
    resource: 'Import/Service/*'

  YesWiki\Import\Action\:
    resource: 'Import/Action/*'

  YesWiki\Import\Api\:
    resource: 'Import/Api/*'

  YesWiki\Contact\Service\:
    resource: 'Contact/Service/*'

  YesWiki\Contact\Action\:
    resource: 'Contact/Action/*'

  YesWiki\Contact\Api\:
    resource: 'Contact/Api/*'

  YesWiki\Files\Service\:
    resource: 'Files/Service/*'

  YesWiki\Federation\Service\:
    resource: 'Federation/Service/*'

  YesWiki\Social\Service\:
    resource: 'Social/Service/*'

  YesWiki\Social\Action\:
    resource: 'Social/Action/*'

  YesWiki\Social\Api\:
    resource: 'Social/Api/*'

  YesWiki\Federation\Action\:
    resource: 'Federation/Action/*'

  YesWiki\Search\Api\:
    resource: 'Search/Api/*'

  YesWiki\Admin\Api\:
    resource: 'Admin/Api/*'

  # the bootstrap initializes languages before the container exists; serve that same instance
  YesWiki\Kernel\Service\LanguageService:
    factory: [null, 'getInstance']

  YesWiki\Social\Service\CommentService:
    tags:
      - { name: yeswiki.event_subscriber }
  YesWiki\Render\Service\ThemeManager:
    tags:
      - { name: yeswiki.event_subscriber }
  YesWiki\Federation\Service\WebFinger:
    autowire: false
  YesWiki\Content\Service\EntryDateService:
    tags:
      - { name: yeswiki.event_subscriber }
  # outgoing webhooks on comment/entry events (ticket 20)
  YesWiki\Admin\Controller\WebhooksController:
    tags:
      - { name: yeswiki.event_subscriber }
  # keeps the search index in step with Content and form changes (ticket 18)
  YesWiki\Search\Service\SearchIndexSubscriber:
    tags:
      - { name: yeswiki.event_subscriber }
  # announces entry changes to a form's ActivityPub followers (ticket 39). Subscribing works
  # because the entry.* events are dispatched by EntryManager now, not by EntryController.
  YesWiki\Federation\Service\FederatesEntryChanges:
    tags:
      - { name: yeswiki.event_subscriber }
  # imports the data sources flagged syncOnMaintenance, on the wiki's own housekeeping
  YesWiki\Import\Service\MaintenanceSyncSubscriber:
    tags:
      - { name: yeswiki.event_subscriber }
  # sends the mailing-list digests on a wiki with no cron, on the same housekeeping pass
  YesWiki\Contact\Service\ContactDigestScheduler:
    tags:
      - { name: yeswiki.event_subscriber }

  # An importer is constructed per data source, with that source's config key -- a scalar no
  # container can autowire. These definitions exist so ImporterManager can *find* them by
  # service id (any id ending in "Importer"); it constructs them itself. An extension adding
  # an importer declares it the same way.
  YesWiki\Import\Service\RssImporter:
    autowire: false
  YesWiki\Import\Service\ImapImporter:
    autowire: false
  YesWiki\Import\Service\YesWikiListImporter:
    autowire: false
  YesWiki\Import\Service\YesWikiToYesWikiImporter:
    autowire: false

  YesWiki\Content\Service\EntryExtraFieldsService:
    arguments:
      $contributors: !tagged_iterator yeswiki.entry_fields

  YesWiki\Content\Service\PageViewAppendices:
    arguments:
      $appendices: !tagged_iterator yeswiki.page_view_appendix
