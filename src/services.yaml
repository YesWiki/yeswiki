services:
  _defaults:
    autowire: true
    public: true

  # Manually set inside the initCoreService method
  # Allow to imitate Symfony https://symfony.com/doc/current/service_container/synthetic_services.html
  Symfony\Component\DependencyInjection\ParameterBag\ParameterBagInterface:
    synthetic: true

  # Manually set inside the initCoreService method
  Symfony\Component\Security\Csrf\CsrfTokenManager:
    synthetic: true

  # Manually set inside the initCoreService method
  # TODO remove this object when refactoring will be finished
  YesWiki\Wiki:
    synthetic: true

  # Allow autowiring services that need the container itself (e.g. to fetch a
  # service lazily and break a circular dependency), matching Symfony's own
  # convention of aliasing the PSR container interface to service_container.
  Psr\Container\ContainerInterface: '@service_container'

  YesWiki\Core\Service\:
    resource: 'services/*'
    exclude:
      # implementation details of MarkdownFormatterService, not services themselves
      - 'services/MarkdownFormatter/*'
      # a value object constructed with `new` (its ctor takes the items to paginate),
      # not an injectable service. It lives under services/ only because the current
      # autoloader maps YesWiki\Core\Service\* to that directory; ticket 05's PSR-4
      # move gives it a more honest home.
      - 'services/Paginator.php'

  # Wave-two ticket 05: modules migrate to Composer PSR-4 one at a time. A module's
  # namespace maps to its own directory (YesWiki\Search\Service\X -> src/Search/Service/X.php),
  # which is what PSR-4 requires and what the flat services/ + controllers/ layout could
  # never satisfy. YesWiki\Core\* below keeps its bespoke loader until every module has moved.
  YesWiki\Search\:
    resource: 'Search/*'

  YesWiki\Core\Controller\:
    resource: 'controllers/*'
    # the web installer runs before the container exists (no config file, no database)
    exclude: 'controllers/InstallationController.php'

  # the bootstrap initializes languages before the container exists; serve that same instance
  YesWiki\Core\Service\LanguageService:
    factory: [null, 'getInstance']

  YesWiki\Core\Service\CommentService:
    tags:
      - { name: yeswiki.event_subscriber }
  YesWiki\Core\Service\ThemeManager:
    tags:
      - { name: yeswiki.event_subscriber }
  YesWiki\Core\Service\WebFinger:
    autowire: false
  YesWiki\Core\Service\EntryDateService:
    tags:
      - { name: yeswiki.event_subscriber }
  # outgoing webhooks on comment/entry events (ticket 20)
  YesWiki\Core\Controller\WebhooksController:
    tags:
      - { name: yeswiki.event_subscriber }
