# The dev stack: php-fpm on the checkout behind nginx, MySQL and PostgreSQL, SeaweedFS for S3, phpMyAdmin, a mail catcher,
# and an LDAP directory with an SSO portal for the sign-in providers.
# COMPOSE_PROJECT_NAME and the YESWIKI_*_PORT variables in docker/.env let several checkouts run a stack side by side;
# the service names stay the same in every stack, since nginx.conf and tests/e2e reach each other by them.
name: ${COMPOSE_PROJECT_NAME:-yeswiki}

volumes:
  yeswiki-db:
    name: ${COMPOSE_PROJECT_NAME:-yeswiki}-db
  yeswiki-pg:
    name: ${COMPOSE_PROJECT_NAME:-yeswiki}-pg

services:
  yeswiki-app:
    build:
      context: ..
      dockerfile: ./docker/dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-app
    volumes:
      - ..:/var/www/html
    depends_on:
      yeswiki-db:
        condition: service_healthy
      yeswiki-pg:
        condition: service_healthy
    env_file: ./yeswiki.secrets
    user: "${UID:-1000}:${GID:-1000}"
    command: /var/www/html/docker/entrypoint.sh

  yeswiki-db:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-db
    volumes:
      - yeswiki-db:/var/lib/mysql
    env_file: ./yeswiki.secrets
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  yeswiki-pg:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-pg
    volumes:
      - yeswiki-pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: yeswiki
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yeswiki
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yeswiki"]
      interval: 5s
      timeout: 5s
      retries: 30

  yeswiki-s3:
    image: chrislusf/seaweedfs:4.53
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-s3
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${YESWIKI_S3_PORT:-8333}:8333"

  # A real company directory and a real identity server, so that the sign-in providers are
  # tested against servers rather than against mocks. Test-only: nothing here reaches the
  # binary or the production image.
  yeswiki-ldap:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-ldap
    environment:
      LDAP_ROOT: dc=acme,dc=example
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: AdminPassword1
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    volumes:
      - ./openldap:/ldifs:ro
    ports:
      - "127.0.0.1:${YESWIKI_LDAP_PORT:-1389}:1389"

  # One server for OIDC, SAML and CAS. The network alias shares a domain with the wiki's,
  # so they are same-site on plain http and SAML's POST callback gets its Lax cookie.
  # The conf directory is writable because the image's entrypoint runs sed -i on it, and it
  # is a directory because sed -i cannot replace a file that is itself a mount point.
  # PRESERVEFILES stays unset: the entrypoint would overwrite the configuration below.
  yeswiki-sso:
    image: lemonldapng/lemonldap-ng:2.23.4
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-sso
    environment:
      SSODOMAIN: yeswiki.test
      PORTAL_HOSTNAME: auth.yeswiki.test
      MANAGER_HOSTNAME: manager.yeswiki.test
    volumes:
      - ./lemonldap-ng/conf:/var/lib/lemonldap-ng/conf
    ports:
      - "127.0.0.1:${YESWIKI_SSO_PORT:-8087}:80"
    depends_on:
      - yeswiki-ldap
    networks:
      default:
        aliases:
          - auth.yeswiki.test

  yeswiki-web:
    image: nginx:1.28-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-web
    volumes:
      - ..:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${YESWIKI_WEB_PORT:-8085}:80"
    networks:
      default:
        aliases:
          - wiki.yeswiki.test
    depends_on:
      - yeswiki-app

  myadmin:
    image: phpmyadmin:5.2
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-myadmin
    env_file: ./yeswiki.secrets
    environment:
      PMA_HOST: yeswiki-db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${YESWIKI_MYADMIN_PORT:-8086}:80"
    depends_on:
      yeswiki-db:
        condition: service_healthy

  mail:
    image: axllent/mailpit:v1.27
    container_name: ${COMPOSE_PROJECT_NAME:-yeswiki}-mail
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:587
      MP_SMTP_TLS_CERT: sans:mail
      MP_SMTP_TLS_KEY: sans:mail
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: yeswiki:password
    ports:
      - "127.0.0.1:${YESWIKI_MAIL_PORT:-1080}:8025"
