volumes:
  yeswiki-db:
    name: yeswiki-main-db

networks:
  yeswiki-main:

services:
    yeswiki-main-app:
        build:
          context: ..
          dockerfile: ./docker/dockerfile
          args:
            UID: "${UID:-1000}"
            GID: "${UIS:-1000}"
        container_name: yeswiki-main
        volumes:
          - ..:/var/www/html
        depends_on:
          - yeswiki-main-db
        env_file: ./yeswiki.secrets
        user: "${UID}:${UID}"
        command: /var/www/html/docker/entrypoint.sh
        networks:
          - yeswiki-main

    yeswiki-main-db:
        image: mysql:latest
        container_name: yeswiki-main-db
        volumes:
          - yeswiki-db:/var/lib/mysql
        env_file: ./yeswiki.secrets
        networks:
          - yeswiki-main

    yeswiki-main-web:
        image: nginx:alpine
        container_name: yeswiki-main-web
        volumes:
          - ..:/var/www/html:ro
          - ./nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
          - "8005:80"
        depends_on:
          - yeswiki-main-app
          - myadmin-main
        networks:
          - yeswiki-main

    myadmin-main:
      image: phpmyadmin:latest
      container_name: myadmin-main
      env_file: ./yeswiki.secrets
      environment:
        PMA_HOST: yeswiki-main-db
        PMA_PORT: 3306
      ports:
        - "8006:80"
      networks:
        - yeswiki-main

    mail-main:
      image: maildev/maildev
      container_name: mail-main
      ports:
        - "1000:1080"
      networks:
        - yeswiki-main
