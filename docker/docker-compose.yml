# Everything this stack claims on the host can be set per checkout, so that several YesWiki
# stacks can run side by side: Compose project, containers, volumes, published ports.
# Service names stay generic on purpose: they are only DNS names on the project's own
# network, and nginx.conf and tests/e2e rely on them.
#
# To run another stack at once (from another checkout), set these in its
# docker/.env: COMPOSE_PROJECT_NAME and the YESWIKI_*_PORT variables.
name: ${COMPOSE_PROJECT_NAME:-yeswiki}

volumes:
  yeswiki-db:
    name: ${COMPOSE_PROJECT_NAME}-db
  yeswiki-pg:
    name: ${COMPOSE_PROJECT_NAME}-pg

services:
    yeswiki-app:
        build:
          context: ..
          dockerfile: ./docker/dockerfile
          args:
            UID: "${UID:-1000}"
            GID: "${GID:-1000}"
        container_name: ${COMPOSE_PROJECT_NAME}-app
        volumes:
          - ..:/var/www/html
        depends_on:
          - yeswiki-db
          - yeswiki-pg
        env_file: ./yeswiki.secrets
        user: "${UID:-1000}:${GID:-1000}"
        command: /var/www/html/docker/entrypoint.sh

    yeswiki-db:
        image: mysql:latest
        container_name: ${COMPOSE_PROJECT_NAME}-db
        volumes:
          - yeswiki-db:/var/lib/mysql
        env_file: ./yeswiki.secrets

    # ADR-0015 commits the search index to all three dialects, and PostgreSQL's -- a
    # generated tsvector with a GIN index -- is the one nothing had ever executed. It gets a
    # service so that "supported" and "tested" can mean the same thing:
    #   YESWIKI_TEST_DRIVER=pgsql bash tests/e2e/reset.sh && npx playwright test
    # It is additive: nothing points at it unless a run asks for it, so the MySQL default is
    # untouched.
    yeswiki-pg:
        image: postgres:16-alpine
        container_name: ${COMPOSE_PROJECT_NAME}-pg
        volumes:
          - yeswiki-pg:/var/lib/postgresql/data
        environment:
          POSTGRES_USER: yeswiki
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yeswiki

    # Ticket 42 puts Public and Protected bytes in an S3-compatible bucket. `weed server -s3`
    # is master, volume, filer and the S3 gateway in one container, which is what makes an
    # object store usable as a test service. Where it differs from AWS: addressing is
    # path-style (YESWIKI_S3_PATH_STYLE=1) and reads are anonymous by the config file below,
    # which is what lets the public-URL half of the ticket be tested at all. It creates a
    # bucket on the first write, so nothing has to create one; AWS does not, and that is a
    # deployment step docs/fr/admin.md carries.
    yeswiki-s3:
        image: chrislusf/seaweedfs
        container_name: ${COMPOSE_PROJECT_NAME}-s3
        command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64
        volumes:
          - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
        ports:
          - "${YESWIKI_S3_PORT:-8333}:8333"

    # A real company directory and a real identity server, so that the sign-in providers are
    # tested against servers rather than against mocks. Test-only: nothing here reaches the
    # binary or the production image.
    yeswiki-ldap:
        image: bitnamilegacy/openldap:2.6.10-debian-12-r4
        container_name: ${COMPOSE_PROJECT_NAME}-ldap
        environment:
          LDAP_ROOT: dc=acme,dc=example
          LDAP_ADMIN_USERNAME: admin
          LDAP_ADMIN_PASSWORD: AdminPassword1
          LDAP_CUSTOM_LDIF_DIR: /ldifs
        volumes:
          - ./openldap:/ldifs:ro
        ports:
          - "${YESWIKI_LDAP_PORT:-1389}:1389"

    # One server for OIDC, SAML and CAS. The network alias shares a domain with the wiki's,
    # so they are same-site on plain http and SAML's POST callback gets its Lax cookie.
    # The conf directory is writable because the image's entrypoint runs sed -i on it, and it
    # is a directory because sed -i cannot replace a file that is itself a mount point.
    # PRESERVEFILES stays unset: the entrypoint would overwrite the configuration below.
    yeswiki-sso:
        image: lemonldapng/lemonldap-ng:2.23.4
        container_name: ${COMPOSE_PROJECT_NAME}-sso
        environment:
          SSODOMAIN: yeswiki.test
          PORTAL_HOSTNAME: auth.yeswiki.test
          MANAGER_HOSTNAME: manager.yeswiki.test
        volumes:
          - ./lemonldap-ng/conf:/var/lib/lemonldap-ng/conf
        ports:
          - "${YESWIKI_SSO_PORT:-8087}:80"
        depends_on:
          - yeswiki-ldap
        networks:
          default:
            aliases:
              - auth.yeswiki.test

    yeswiki-web:
        image: nginx:alpine
        container_name: ${COMPOSE_PROJECT_NAME}-web
        volumes:
          - ..:/var/www/html:ro
          - ./nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
          - "${YESWIKI_WEB_PORT:-8085}:80"
        networks:
          default:
            aliases:
              - wiki.yeswiki.test
        depends_on:
          - yeswiki-app
          - myadmin

    myadmin:
      image: phpmyadmin:latest
      container_name: ${COMPOSE_PROJECT_NAME}-myadmin
      env_file: ./yeswiki.secrets
      environment:
        PMA_HOST: yeswiki-db
        PMA_PORT: 3306
      ports:
        - "${YESWIKI_MYADMIN_PORT:-8086}:80"

    mail:
      image: maildev/maildev
      container_name: ${COMPOSE_PROJECT_NAME}-mail
      ports:
        - "${YESWIKI_MAIL_PORT:-1080}:1080"
