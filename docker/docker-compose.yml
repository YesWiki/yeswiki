volumes:
  yeswiki-db:
    name: yeswiki-db

networks:
  yeswiki:

services:
    yeswiki-app:
        build:
          context: containers/dev
          args:
            UID: "${UID:-1000}"
            GID: "${UIS:-1000}"
        container_name: yeswiki
        working_dir: /var/www/html
        volumes:
          - ..:/var/www/html
        depends_on:
          - yeswiki-db
        env_file: ./yeswiki.secrets
        environment:
          - NGINX_WEB_ROOT=/var/www/html
        networks:
          - yeswiki
        ports:
          - "8085:80"

    yeswiki-db:
        image: mysql:8.0
        container_name: yeswiki-db
        volumes:
          - yeswiki-db:/var/lib/mysql
        env_file: ./yeswiki.secrets
        networks:
          - yeswiki

#    yeswiki-web:
#        image: nginx:alpine
#        container_name: yeswiki-web
#        volumes:
#          - ..:/var/www/html:ro
#          - ./nginx.conf:/etc/nginx/nginx.conf:ro
#        ports:
#          - "8085:80"
#        depends_on:
#          - yeswiki-app
#          - myadmin
#        networks:
#          - yeswiki

    myadmin:
      image: phpmyadmin:latest
      container_name: myadmin
      env_file: ./yeswiki.secrets
      environment:
        PMA_HOST: yeswiki-db
        PMA_PORT: 3306
      ports:
        - "8086:80"
      networks:
        - yeswiki

    mail:
      image: maildev/maildev
      container_name: mail
      ports:
        - "1080:1080"
      networks:
        - yeswiki
