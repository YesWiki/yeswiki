name: Tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Tags'
  push:
    branches: [doryphore, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [doryphore, doryphore-dev, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'

env:
  DB_NAME: yeswiki_test
  DB_USER: root
  DB_PASSWORD: root
  WIKI_HOST: 127.0.0.1:8080

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # Everything composer.json declares under ext-*, so `composer install`
          # and the installer request run against the same extension set.
          extensions: ctype, curl, fileinfo, filter, gd, iconv, mbstring, pdo, pdo_sqlite, zip
          tools: composer:v2

      - run: php -v

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PHP's built-in server is the binary setup-php just put on PATH, so the SAPI
      # serving the installer is the matrix version by construction. Installing a
      # distro php<version>-fpm cannot do that: the Ubuntu archive only carries one
      # PHP version, so two of the three matrix legs had no FPM package to install.
      - name: Start PHP built-in server
        run: |
          mkdir -p ${{ github.workspace }}/cache ${{ github.workspace }}/private/backups
          # Workers > 1 so a request that triggers a sub-request cannot deadlock the server.
          PHP_CLI_SERVER_WORKERS=4 nohup php -S ${{ env.WIKI_HOST }} -t ${{ github.workspace }} \
            > ${{ runner.temp }}/php-server.log 2>&1 &
          for _ in $(seq 20); do
            curl --silent --fail http://${{ env.WIKI_HOST }} > /dev/null && exit 0
            sleep 1
          done
          echo "server did not come up"; cat ${{ runner.temp }}/php-server.log; exit 1

      - name: Setup Wiki
        run: |
          curl --silent --fail --show-error \
            -F "config[default_language]=fr" \
            -F "config[yeswiki_name]=MyTestWiki" \
            -F "config[root_page]=PagePrincipale" \
            -F "config[base_url]=http://${{ env.WIKI_HOST }}/?" \
            -F "config[db_host]=127.0.0.1" \
            -F "config[db_database]=${{ env.DB_NAME }}" \
            -F "config[db_user]=${{ env.DB_USER }}" \
            -F "config[db_password]=${{ env.DB_PASSWORD }}" \
            -F "config[table_prefix]=yeswiki_" \
            -F "config[allow_raw_html]=1" \
            -F "config[archive][privatePath]=${{ github.workspace }}/private/backups" \
            -F "admin_name=ActionTest" \
            -F "admin_password=ActionTestPassword" \
            -F "admin_password_conf=ActionTestPassword" \
            -F "admin_email=test@example.com" \
            -F "submit=Continue" \
            "http://${{ env.WIKI_HOST }}/?PagePrincipale&installAction=install"

      # `javascripts/vendor/` and `styles/vendor/` are gitignored: they are copied out of
      # node_modules by the `postinstall` hook, so a fresh checkout has neither. Without this
      # step htmx, Ace and Leaflet are simply absent, and the tests that assert a page links
      # to them fail on every leg of the matrix (CoreAssetsTest, VendoredAssetsTest,
      # ApiControllerFormPreviewTest). Runs before the wiki is exercised, not just before
      # `test-js` -- which needs nothing installed and so never revealed this.
      - name: Install JS dependencies (populates javascripts/vendor via postinstall)
        run: yarn install --frozen-lockfile

      - name: Run JS unit tests
        run: yarn run test-js

      - name: Run test suite
        run: composer test

      - name: Dump server log
        if: failure()
        run: cat ${{ runner.temp }}/php-server.log
