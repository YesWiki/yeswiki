name: Tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Tags'
  push:
    branches: [doryphore, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [doryphore, doryphore-dev, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'

env:
  # Only what is genuinely shared by every leg. Per-driver credentials live on the matrix rows
  # below, next to the driver they belong to.
  WIKI_HOST: 127.0.0.1:8080

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    name: PHP ${{ matrix.php-version }} / ${{ matrix.driver }}

    strategy:
      # One driver failing must not cancel the others: which drivers a change breaks is the
      # information this matrix exists to produce, and fail-fast throws most of it away.
      fail-fast: false
      matrix:
        # Three drivers are supported (ADR-0015 commits the search index to all three) and
        # until now CI ran one. The dialects are where they differ -- SQLite accepts what
        # MySQL refuses and PostgreSQL is stricter than both -- so a driver leg is worth more
        # than another PHP leg. PHP still spans its supported range, on MySQL.
        #
        # Each leg carries its OWN credentials. They used to come from a `case` on
        # ${{ matrix.driver }} reading workflow-level `env`, and on the pgsql leg that selected
        # the mysql branch: db_driver=pgsql went through correctly while db_user came out as
        # `root`, so the installer dialled PostgreSQL on 5432 with the MySQL account and got
        # `password authentication failed for user "root"`. One value per leg, resolved by the
        # matrix and nothing else, cannot express that.
        include:
          - { php-version: '8.3', driver: 'mysql',  db_user: 'root',    db_password: 'root',     db_name: 'yeswiki_test' }
          - { php-version: '8.4', driver: 'mysql',  db_user: 'root',    db_password: 'root',     db_name: 'yeswiki_test' }
          - { php-version: '8.5', driver: 'mysql',  db_user: 'root',    db_password: 'root',     db_name: 'yeswiki_test' }
          - { php-version: '8.3', driver: 'sqlite', db_user: '',        db_password: '',         db_name: '' }
          - { php-version: '8.3', driver: 'pgsql',  db_user: 'yeswiki', db_password: 'password', db_name: 'yeswiki_test' }
          # Ticket 42: storage and the database are orthogonal, so one leg proves the bucket
          # rather than six. It is the SQLite one because it is the cheapest, and it is the
          # only leg where StorageContractTest runs its S3 half instead of skipping it.
          - { php-version: '8.3', driver: 'sqlite', db_user: '',        db_password: '',         db_name: '', s3: true }

    # `services` cannot be conditioned on the matrix, so both servers start on every leg and
    # the SQLite ones simply ignore them. The alternative is one job per driver with the steps
    # duplicated three times, which is a worse trade than a container nobody connects to.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yeswiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yeswiki
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yeswiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yeswiki -d yeswiki_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      # Not a `services:` entry: SeaweedFS needs its identity file, service containers start
      # before the checkout, and without credentials it answers 403 to every write. Started
      # here, after the file exists. It creates its bucket on the first write, which is where
      # it differs from AWS.
      - name: Start SeaweedFS
        if: matrix.s3
        run: |
          docker run -d --name yeswiki-s3 -p 8333:8333 \
            -v ${{ github.workspace }}/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64
          for _ in $(seq 1 60); do
            curl -s -o /dev/null -m 2 http://127.0.0.1:8333 && break
            sleep 2
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # Everything composer.json declares under ext-*, so `composer install`
          # and the installer request run against the same extension set. All three PDO
          # drivers, so the same image serves every leg of the matrix -- the installer only
          # offers a driver whose extension is loaded (InstallationService::availableDrivers).
          # ExtensionManifestTest asserts this line and composer.json's `require` still agree:
          # the list drifted once already, which is how ext-openssl went four years undeclared
          # while every leg happened to have it (ticket 47).
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, session, simplexml, tokenizer, xml, xmlreader, zip
          tools: composer:v2

      - run: php -v

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PHP's built-in server is the binary setup-php just put on PATH, so the SAPI
      # serving the installer is the matrix version by construction. Installing a
      # distro php<version>-fpm cannot do that: the Ubuntu archive only carries one
      # PHP version, so two of the three matrix legs had no FPM package to install.
      - name: Start PHP built-in server
        run: |
          mkdir -p ${{ github.workspace }}/cache ${{ github.workspace }}/private/backups
          # Workers > 1 so a request that triggers a sub-request cannot deadlock the server.
          # tests/ci-router.php denies private/, which .htaccess does for Apache and the
          # built-in server honours nothing. Without it ArchiveService correctly refuses to
          # archive a wiki whose backups answer 200 to anyone.
          PHP_CLI_SERVER_WORKERS=4 nohup php -S ${{ env.WIKI_HOST }} -t ${{ github.workspace }} \
            ${{ github.workspace }}/tests/ci-router.php \
            > ${{ runner.temp }}/php-server.log 2>&1 &
          for _ in $(seq 20); do
            curl --silent --fail http://${{ env.WIKI_HOST }} > /dev/null && exit 0
            sleep 1
          done
          echo "server did not come up"; cat ${{ runner.temp }}/php-server.log; exit 1

      # The driver is named explicitly now. It never was, so the installer fell through to its
      # `mysql` default and the wiki CI tested was always MySQL -- the driver was not a choice
      # anyone had made, which is why nobody noticed it was the only one covered.
      # SQLite needs no credentials and ignores db_database: the installer puts the file at a
      # fixed private/yeswiki.db (InstallationService::SQLITE_DATABASE_PATH).
      - name: Setup Wiki
        run: |
          # SQLite takes no credentials and ignores db_database: the installer puts the file at a
          # fixed private/yeswiki.db (InstallationService::SQLITE_DATABASE_PATH).
          DB_ARGS=()
          if [ "${{ matrix.driver }}" != "sqlite" ]; then
            DB_ARGS=(
              -F "config[db_host]=127.0.0.1"
              -F "config[db_database]=${{ matrix.db_name }}"
              -F "config[db_user]=${{ matrix.db_user }}"
              -F "config[db_password]=${{ matrix.db_password }}"
            )
          fi
          # printed so a failure says which account was dialled, which is what the last one hid
          echo "installing: driver=${{ matrix.driver }} user=${{ matrix.db_user }} database=${{ matrix.db_name }}"
          curl --silent --fail --show-error \
            -F "config[default_language]=fr" \
            -F "config[yeswiki_name]=MyTestWiki" \
            -F "config[root_page]=PagePrincipale" \
            -F "config[base_url]=http://${{ env.WIKI_HOST }}/?" \
            -F "config[db_driver]=${{ matrix.driver }}" \
            "${DB_ARGS[@]}" \
            -F "config[table_prefix]=yeswiki_" \
            -F "config[allow_raw_html]=1" \
            -F "admin_name=ActionTest" \
            -F "admin_password=ActionTestPassword" \
            -F "admin_password_conf=ActionTestPassword" \
            -F "admin_email=test@example.com" \
            -F "submit=Continue" \
            "http://${{ env.WIKI_HOST }}/?PagePrincipale&installAction=install" \
            > ${{ runner.temp }}/install.html

      # The installer renders its failures as an ordinary page, so it answers 200 whether it
      # worked or not and `curl --fail` proves nothing. Assert what actually matters: a config
      # that configures a wiki. Without this the pgsql leg went green here and failed three
      # steps later with "Command migrate is not defined" -- the console registers only its
      # runs-outside-an-instance commands when `base_url` is missing, so the real error was an
      # install failure reported as a missing command.
      - name: Check the wiki really installed
        run: |
          if ! grep -q "'base_url'" yeswiki.config.php 2>/dev/null; then
            echo "::error::The installer did not write a usable yeswiki.config.php."
            echo "--- installer response ---"
            sed -e 's/<[^>]*>//g' ${{ runner.temp }}/install.html | tr -s ' \n' ' \n' | grep -viE '^\s*$' | tail -60
            echo "--- php server log ---"
            cat ${{ runner.temp }}/php-server.log
            exit 1
          fi
          echo "installed on ${{ matrix.driver }}"

      # The installer creates the tables a fresh wiki needs and nothing more; migrations own
      # everything added since, including the search index table (20260802120000_CreateSearchIndex).
      # Without this step SearchIndexTest, SearchIndexAclTest, SearchIndexCascadeTest and
      # SearchSurfaceTest all call markTestSkipped('no search index on this wiki') -- so CI was
      # reporting green over the most dialect-specific code in the repo, which is exactly what
      # a driver matrix is here to exercise. tests/e2e/reset.sh has always done install-then-migrate.
      # `./yeswicli`, not `php yeswicli`: it is a bash wrapper that resolves symlinks before
      # handing off to PHP, so invoking it through the PHP binary prints the command list and
      # exits 0 -- a step that looks like it migrated and did not. The 100755 mode is committed.
      - name: Run migrations
        run: ./yeswicli migrate

      # `javascripts/vendor/` and `styles/vendor/` are gitignored: they are copied out of
      # node_modules by the `postinstall` hook, so a fresh checkout has neither. Without this
      # step htmx, Ace and Leaflet are simply absent, and the tests that assert a page links
      # to them fail on every leg of the matrix (CoreAssetsTest, VendoredAssetsTest,
      # ApiControllerFormPreviewTest). Runs before the wiki is exercised, not just before
      # `test-js` -- which needs nothing installed and so never revealed this.
      - name: Install JS dependencies (populates javascripts/vendor via postinstall)
        run: yarn install --frozen-lockfile

      - name: Run JS unit tests
        run: yarn run test-js

      - name: Run test suite
        run: composer test
        env:
          # Empty on every other leg, which is how StorageContractTest knows to skip its S3 half.
          YESWIKI_TEST_S3_ENDPOINT: ${{ matrix.s3 && 'http://127.0.0.1:8333' || '' }}
          YESWIKI_TEST_S3_PUBLIC_URL: ${{ matrix.s3 && 'http://127.0.0.1:8333/yeswiki-test' || '' }}

      - name: Dump server log
        if: failure()
        run: cat ${{ runner.temp }}/php-server.log
