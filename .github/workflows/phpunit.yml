name: Tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Tags'
  push:
    branches: [doryphore, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [doryphore, doryphore-dev, ectoplasme]
    paths:
      - 'composer.lock'
      # '*.php' matched root-level files only -- GitHub's glob '*' does not cross '/',
      # so no change under src/, actions/, handlers/ or tests/ ever triggered this
      # workflow. '**.php' is what was meant.
      - '**.php'
      - '.github/workflows/*.yml'

env:
  DB_NAME: yeswiki_test
  DB_USER: root
  DB_PASSWORD: root

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure and start Nginx + PHP-FPM
        run: |
          sudo apt update
          sudo apt install --no-install-recommends --assume-yes nginx php${{ matrix.php-version }}-fpm

          # Run nginx and PHP-FPM as the runner user to avoid workspace traversal permission issues
          sudo sed -i 's/^user www-data;/user runner;/' /etc/nginx/nginx.conf
          sudo sed -i \
            -e 's/^user = www-data$/user = runner/' \
            -e 's/^group = www-data$/group = runner/' \
            -e 's/^listen\.owner = www-data$/listen.owner = runner/' \
            -e 's/^listen\.group = www-data$/listen.group = runner/' \
            /etc/php/${{ matrix.php-version }}/fpm/pool.d/www.conf

          cat << 'EOF' > /tmp/nginx-yeswiki.conf
          server {
              listen 80;
              root __WORKSPACE__;
              index index.php index.html;
              client_max_body_size 512M;
              location / {
                  try_files $uri $uri/ /index.php$is_args$args;
              }
              location ~* /(.*/)?private/ {
                  deny all;
                  return 403;
              }
              location ~ [^/]\.php(/|$) {
                  fastcgi_split_path_info ^(.+?\.php)(/.*)$;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
                  fastcgi_pass unix:/run/php/php__PHPVER__-fpm.sock;
                  fastcgi_intercept_errors on;
                  fastcgi_request_buffering off;
                  fastcgi_read_timeout 600;
              }
          }
          EOF
          sed -i 's|__WORKSPACE__|${{ github.workspace }}|; s|__PHPVER__|${{ matrix.php-version }}|' /tmp/nginx-yeswiki.conf
          sudo cp /tmp/nginx-yeswiki.conf /etc/nginx/sites-enabled/default

          mkdir -p ${{ github.workspace }}/cache ${{ github.workspace }}/private/backups
          sudo /etc/init.d/php${{ matrix.php-version }}-fpm restart
          sudo /etc/init.d/nginx restart

      - run: curl http://localhost

      - name: Setup Wiki
        run: |
          curl --silent --fail --show-error \
            -F "config[default_language]=fr" \
            -F "config[yeswiki_name]=MyTestWiki" \
            -F "config[root_page]=PagePrincipale" \
            -F "config[base_url]=http://localhost/?" \
            -F "config[db_host]=127.0.0.1" \
            -F "config[db_database]=${{ env.DB_NAME }}" \
            -F "config[db_user]=${{ env.DB_USER }}" \
            -F "config[db_password]=${{ env.DB_PASSWORD }}" \
            -F "config[table_prefix]=yeswiki_" \
            -F "config[allow_raw_html]=1" \
            -F "config[archive][privatePath]=${{ github.workspace }}/private/backups" \
            -F "admin_name=ActionTest" \
            -F "admin_password=ActionTestPassword" \
            -F "admin_password_conf=ActionTestPassword" \
            -F "admin_email=test@example.com" \
            -F "submit=Continue" \
            "http://localhost/?PagePrincipale&installAction=install"

      - name: Run test suite
        run: composer test
