name: Tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Tags'
  push:
    branches: [doryphore, ectoplasme]
    paths:
      - 'composer.lock'
      - '*.php'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [doryphore, doryphore-dev, ectoplasme]
    paths:
      - 'composer.lock'
      - '*.php'
      - '.github/workflows/*.yml'

env:
  DB_NAME: yeswiki_test
  DB_USER: root
  DB_PASSWORD: root

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure and start Nginx + PHP-FPM
        run: |
          sudo apt update
          sudo apt install --no-install-recommends --assume-yes nginx php${{ matrix.php-version }}-fpm
          printf 'server {\n\
              listen 80;\n\
              root %s;\n\
              index index.php index.html;\n\
              client_max_body_size 512M;\n\
              location / {\n\
                  try_files $uri $uri/ /index.php$is_args$args;\n\
              }\n\
              location ~* /(.*/)?private/ {\n\
                  deny all;\n\
                  return 403;\n\
              }\n\
              location ~ [^/]\\.php(/|$) {\n\
                  fastcgi_split_path_info ^(.+?\\.php)(/.*)$;\n\
                  include fastcgi_params;\n\
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;\n\
                  fastcgi_param PATH_INFO $fastcgi_path_info;\n\
                  fastcgi_pass unix:/run/php/php%s-fpm.sock;\n\
                  fastcgi_intercept_errors on;\n\
                  fastcgi_request_buffering off;\n\
                  fastcgi_read_timeout 600;\n\
              }\n\
          }\n' "${{ github.workspace }}" "${{ matrix.php-version }}" \
            | sudo tee /etc/nginx/sites-enabled/default
          sudo chown www-data:www-data -R ${{ github.workspace }}
          sudo /etc/init.d/php${{ matrix.php-version }}-fpm start
          sudo /etc/init.d/nginx start

      - name: Append current user in www-data group
        run: sudo usermod -aG www-data $USER

      - name: Set cache folder writable
        run: |
          sudo mkdir -p ${{ github.workspace }}/cache
          sudo chmod -R 0777 ${{ github.workspace }}/cache

      - name: Set private folder for archive
        run: |
          sudo mkdir -p ${{ github.workspace }}/private/archives
          sudo chown www-data:www-data -R ${{ github.workspace }}/private/archives
          sudo chmod -R 0777 ${{ github.workspace }}/private/archives

      - run: curl http://localhost

      - name: Setup Wiki
        run: |
          curl --silent --fail --show-error \
            -F "config[default_language]=fr" \
            -F "config[wakka_name]=MyTestWiki" \
            -F "config[root_page]=PagePrincipale" \
            -F "config[base_url]=http://localhost/?" \
            -F "config[mysql_host]=127.0.0.1" \
            -F "config[mysql_database]=${{ env.DB_NAME }}" \
            -F "config[mysql_user]=${{ env.DB_USER }}" \
            -F "config[mysql_password]=${{ env.DB_PASSWORD }}" \
            -F "config[table_prefix]=yeswiki_" \
            -F "config[allow_raw_html]=1" \
            -F "config[archive][privatePath]=${{ github.workspace }}/private/archives" \
            -F "admin_name=ActionTest" \
            -F "admin_password=ActionTestPassword" \
            -F "admin_password_conf=ActionTestPassword" \
            -F "admin_email=test@example.com" \
            -F "submit=Continue" \
            "http://localhost/?PagePrincipale&installAction=install"

      - name: Set wakka.config.php writable
        run: |
          sudo chown www-data:www-data ${{ github.workspace }}/wakka.config.php
          sudo chmod 0777 ${{ github.workspace }}/wakka.config.php

      - name: Run test suite
        run: composer test
