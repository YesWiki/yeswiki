name: Browser suite

# Browser suite: a cheap matrix by default, the full one nightly and before a release.

on:
  pull_request:
    branches: [doryphore, doryphore-dev, ectoplasme]
  push:
    branches: [ectoplasme]
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every driver and runtime, not just the default combination'
        type: boolean
        default: true

env:
  YESWIKI_TEST_ROOT: ${{ github.workspace }}

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - id: decide
        run: |
          full=false
          case "${{ github.event_name }}" in
            schedule|release) full=true ;;
            workflow_dispatch) full="${{ inputs.full }}" ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"

          {
            echo "### Browser suite coverage for this run"
            echo
            if [ "$full" = "true" ]; then
              echo 'Running the full matrix: mysql, pgsql and sqlite, under php-fpm and under the binary.'
            else
              echo '| driver | runtime | this run |'
              echo '| --- | --- | --- |'
              echo '| mysql | fpm | **runs** |'
              echo '| mysql | binary | **runs** |'
              echo '| pgsql | fpm | skipped, runs nightly |'
              echo '| pgsql | binary | skipped, runs nightly |'
              echo '| sqlite | fpm | skipped, runs nightly |'
              echo '| sqlite | binary | skipped, runs nightly |'
              echo
              echo 'The binary takes about half an hour to build, so a pull request covers one driver'
              echo 'under both runtimes rather than three drivers under one.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  binary:
    needs: plan
    runs-on: ubuntu-26.04
    outputs:
      cached: ${{ steps.cache.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - id: cache
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: binary/dist/yeswiki-linux-x86_64
          key: e2e-binary-x86_64-${{ hashFiles('binary/**', 'composer.json') }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader
        if: steps.cache.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: '24'

      - run: yarn install --frozen-lockfile
        if: steps.cache.outputs.cache-hit != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Build the static binary
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TARGETARCH: x86_64
          COMPRESS: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./binary/build-static.sh

      - name: Check the binary carries what the manifest names
        run: ./binary/check-binary.sh binary/dist/yeswiki-linux-x86_64

      - name: Packaging smoke
        run: ./binary/smoke.sh binary/dist/yeswiki-linux-x86_64

      - uses: actions/upload-artifact@v6
        with:
          name: yeswiki-e2e-binary
          path: binary/dist/yeswiki-linux-x86_64
          retention-days: 1

  browser:
    needs: [plan, binary]
    name: ${{ matrix.driver }} / ${{ matrix.runtime }}
    runs-on: ubuntu-26.04

    env:
      YESWIKI_TEST_DRIVER: ${{ matrix.driver }}
      YESWIKI_TEST_RUNTIME: ${{ matrix.runtime }}
      YESWIKI_TEST_DB_HOST: 127.0.0.1
      YESWIKI_TEST_DB_USER: ${{ matrix.driver == 'pgsql' && 'yeswiki' || 'root' }}
      YESWIKI_TEST_DB_PASSWORD: ${{ matrix.driver == 'pgsql' && 'password' || 'root' }}
      YESWIKI_TEST_BINARY: ${{ github.workspace }}/binary/dist/yeswiki-linux-x86_64
      YESWIKI_TEST_PROGRAM: ${{ needs.binary.outputs.cached == 'true' && format('{0}/binary/program', github.workspace) || '' }}
      YESWIKI_TEST_BASE_URL: ${{ matrix.runtime == 'binary' && 'http://127.0.0.1:8081/?' || 'http://127.0.0.1:8080/?' }}
      YESWIKI_BASE_URL: ${{ matrix.runtime == 'binary' && 'http://127.0.0.1:8081' || 'http://127.0.0.1:8080' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: mysql,  runtime: fpm }
          - { driver: mysql,  runtime: binary }
          - { driver: pgsql,  runtime: fpm,    only-when-full: true }
          - { driver: pgsql,  runtime: binary, only-when-full: true }
          - { driver: sqlite, runtime: fpm,    only-when-full: true }
          - { driver: sqlite, runtime: binary, only-when-full: true }

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yeswiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yeswiki
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yeswiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yeswiki -d yeswiki_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Skip the combinations this run does not cover
        id: covered
        run: |
          if [ "${{ matrix.only-when-full }}" = "true" ] && [ "${{ needs.plan.outputs.full }}" != "true" ]; then
            echo "::notice::${{ matrix.driver }} / ${{ matrix.runtime }} is skipped on this event and runs nightly"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.covered.outputs.run == 'true'

      # The identity servers of docker/docker-compose.yml, started here and not as `services:`
      # entries: they need files from the checkout, and service containers start before it. The
      # portal reaches the directory by its container name, so both share one network; the
      # runner reaches the portal and the directory by name through /etc/hosts. The wiki is
      # served as wiki.yeswiki.test:<port> for the sign-in specs, which makes it same-site with
      # the portal: SAML's POST callback needs that on plain http.
      - name: Start the identity servers
        if: steps.covered.outputs.run == 'true'
        run: |
          echo '127.0.0.1 wiki.yeswiki.test auth.yeswiki.test yeswiki-ldap' | sudo tee -a /etc/hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ldap-utils
          docker network create yeswiki-sso
          docker run -d --name yeswiki-ldap --network yeswiki-sso -p 1389:1389 \
            -e LDAP_ROOT=dc=acme,dc=example \
            -e LDAP_ADMIN_USERNAME=admin \
            -e LDAP_ADMIN_PASSWORD=AdminPassword1 \
            -e LDAP_CUSTOM_LDIF_DIR=/ldifs \
            -v ${{ github.workspace }}/docker/openldap:/ldifs:ro \
            bitnamilegacy/openldap:2.6.10-debian-12-r4
          for _ in $(seq 1 60); do
            ldapwhoami -x -H ldap://yeswiki-ldap:1389 -D cn=admin,dc=acme,dc=example -w AdminPassword1 > /dev/null 2>&1 && break
            sleep 2
          done
          ldapwhoami -x -H ldap://yeswiki-ldap:1389 -D cn=admin,dc=acme,dc=example -w AdminPassword1 \
            || { echo "the directory did not come up"; docker logs yeswiki-ldap; exit 1; }
          # The entrypoint runs sed -i on the configuration directory, so it is mounted writable.
          docker run -d --name yeswiki-sso --network yeswiki-sso --network-alias auth.yeswiki.test -p 80:80 \
            -e SSODOMAIN=yeswiki.test \
            -e PORTAL_HOSTNAME=auth.yeswiki.test \
            -e MANAGER_HOSTNAME=manager.yeswiki.test \
            -v ${{ github.workspace }}/docker/lemonldap-ng/conf:/var/lib/lemonldap-ng/conf \
            lemonldapng/lemonldap-ng:2.23.4
          for _ in $(seq 1 60); do
            curl --silent --fail --max-time 5 http://auth.yeswiki.test/ > /dev/null && exit 0
            sleep 2
          done
          echo "the portal did not come up"; docker logs yeswiki-sso; exit 1

      - uses: shivammathur/setup-php@v2
        if: steps.covered.outputs.run == 'true'
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, session, simplexml, tokenizer, xml, xmlreader, zip, ldap
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress
        if: steps.covered.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.covered.outputs.run == 'true'
        with:
          node-version: '24'

      - run: yarn install --frozen-lockfile
        if: steps.covered.outputs.run == 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.covered.outputs.run == 'true'

      - uses: actions/download-artifact@v7
        if: steps.covered.outputs.run == 'true' && matrix.runtime == 'binary'
        with:
          name: yeswiki-e2e-binary
          path: binary/dist

      - name: Make the binary executable
        if: steps.covered.outputs.run == 'true' && matrix.runtime == 'binary'
        run: chmod +x binary/dist/yeswiki-linux-x86_64

      - name: Assemble this commit's Program for the cached binary
        if: steps.covered.outputs.run == 'true' && matrix.runtime == 'binary' && needs.binary.outputs.cached == 'true'
        run: bash binary/build-program.sh

      - name: Start the fpm runtime
        if: steps.covered.outputs.run == 'true' && matrix.runtime == 'fpm'
        run: |
          mkdir -p cache private/backups
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t "${{ github.workspace }}" \
            "${{ github.workspace }}/tests/ci-router.php" > "${{ runner.temp }}/fpm.log" 2>&1 &
          for _ in $(seq 20); do
            curl --silent --fail http://127.0.0.1:8080 > /dev/null && exit 0
            sleep 1
          done
          echo "the fpm runtime did not come up"; cat "${{ runner.temp }}/fpm.log"; exit 1

      - name: Install a fresh wiki
        if: steps.covered.outputs.run == 'true'
        run: bash tests/e2e/reset.sh

      - name: Start the runtime under test
        if: steps.covered.outputs.run == 'true'
        env:
          YESWIKI_TEST_URL: http://127.0.0.1:8080/?PagePrincipale
        run: bash tests/e2e/runtime.sh start

      # Everything but the sign-in specs, which run below at the address the portal knows.
      - name: Run the browser suite
        if: steps.covered.outputs.run == 'true'
        run: yarn run test-e2e-all '^(?!.*sign-in-)'

      # The portal only sends the browser back to wiki.yeswiki.test (ports 8080 and 8081 are
      # registered in docker/lemonldap-ng/conf/lmConf-1.json), and the wiki builds its callback
      # addresses from the base URL it was installed with: so this wiki is installed again
      # under that name, which is why this step is not part of the suite above.
      - name: Run the sign-in suite
        if: ${{ !cancelled() && steps.covered.outputs.run == 'true' }}
        env:
          YESWIKI_TEST_BASE_URL: ${{ matrix.runtime == 'binary' && 'http://wiki.yeswiki.test:8081/?' || 'http://wiki.yeswiki.test:8080/?' }}
          YESWIKI_BASE_URL: ${{ matrix.runtime == 'binary' && 'http://wiki.yeswiki.test:8081' || 'http://wiki.yeswiki.test:8080' }}
        run: |
          bash tests/e2e/reset.sh
          # Its own report and output folders: the run above leaves its failure evidence in the
          # defaults, and this one must not overwrite it.
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-signin \
            npx playwright test tests/e2e/tests/sign-in- --output=test-results-signin

      - name: Dump the runtime log
        if: failure() && steps.covered.outputs.run == 'true'
        run: |
          tail -200 /tmp/yeswiki-e2e-serve.log 2>/dev/null || true
          tail -200 "${{ runner.temp }}/fpm.log" 2>/dev/null || true
          docker logs yeswiki-sso 2>&1 | tail -100 || true

      - name: Report runtime crashes
        if: always() && steps.covered.outputs.run == 'true'
        run: |
          [ -f /tmp/yeswiki-e2e-crashes.log ] || exit 0
          count="$(grep -c '^=== RUNTIME CRASH' /tmp/yeswiki-e2e-crashes.log)"
          echo "::error title=Runtime crash::the server under test crashed ${count} time(s) during this run, tests may have passed only after a restart"
          cat /tmp/yeswiki-e2e-crashes.log
          { echo '### Runtime crashes'; echo '```'; cat /tmp/yeswiki-e2e-crashes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: failure() && steps.covered.outputs.run == 'true'
        with:
          name: playwright-report-${{ matrix.driver }}-${{ matrix.runtime }}
          path: playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: failure() && steps.covered.outputs.run == 'true'
        with:
          name: playwright-report-signin-${{ matrix.driver }}-${{ matrix.runtime }}
          path: |
            playwright-report-signin
            test-results-signin
          retention-days: 7
