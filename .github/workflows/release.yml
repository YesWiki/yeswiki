name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.4.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - name: Create release archive
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          ARCHIVE_NAME="yeswiki-${TAG}.zip"
          mkdir -p /tmp/release/yeswiki
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='phpstan' \
            --exclude='.env' \
            --exclude='*.config.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='.twig-cs-fixer.cache' \
            --exclude='.DS_Store' \
            . /tmp/release/yeswiki/
          cd /tmp/release
          zip -r "$GITHUB_WORKSPACE/$ARCHIVE_NAME" yeswiki/
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: ${{ env.ARCHIVE_NAME }}

  binary:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - uses: docker/setup-buildx-action@v3

      - name: Build the static binary
        env:
          TARGETARCH: ${{ matrix.arch }}
          COMPRESS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./binary/build-static.sh

      - name: Check the binary carries what the manifest names
        run: ./binary/check-binary.sh "binary/dist/yeswiki-linux-${{ matrix.arch }}"

      - name: Checksum
        run: |
          cd binary/dist
          sha256sum "yeswiki-linux-${{ matrix.arch }}" > "yeswiki-linux-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: yeswiki-linux-${{ matrix.arch }}
          path: |
            binary/dist/yeswiki-linux-${{ matrix.arch }}
            binary/dist/yeswiki-linux-${{ matrix.arch }}.sha256
            binary/dist/yeswiki-linux-${{ matrix.arch }}.build.json
          retention-days: 7

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          files: |
            binary/dist/yeswiki-linux-${{ matrix.arch }}
            binary/dist/yeswiki-linux-${{ matrix.arch }}.sha256
            binary/dist/yeswiki-linux-${{ matrix.arch }}.build.json

      # The signing key is held offline and is deliberately not a repository secret: a key CI can
      # read is a key anyone with write access to this workflow can read, and this one owns every
      # installed binary (single-binary 05, ADR-0016). CI therefore publishes an unsigned artefact
      # and the release is not installable until somebody signs it on their own machine.
      - name: Say what is still owed before this release can be installed
        run: |
          {
            echo "### yeswiki-linux-${{ matrix.arch }} is built and unsigned"
            echo
            echo 'No installed binary will accept it until it is signed offline:'
            echo
            echo '```'
            echo "gh release download ${{ github.event.inputs.tag || github.event.release.tag_name }} -p 'yeswiki-linux-${{ matrix.arch }}*'"
            echo "yeswiki sign --key ~/.yeswiki-signing/yeswiki-release.key yeswiki-linux-${{ matrix.arch }}"
            echo "gh release upload ${{ github.event.inputs.tag || github.event.release.tag_name }} yeswiki-linux-${{ matrix.arch }}.sig"
            echo '```'
            echo
            echo 'Then build the repository, which picks up the binary, its signature and its checksum.'
          } >> "$GITHUB_STEP_SUMMARY"
