name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.4.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

  build:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - name: Set the release number
        run: |
          RELEASE="${TAG#v}"
          echo "$RELEASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          sed -i "s/define('YESWIKI_RELEASE', '[^']*');/define('YESWIKI_RELEASE', '$RELEASE');/" includes/constants.php
          grep -q "define('YESWIKI_RELEASE', '$RELEASE');" includes/constants.php

      - name: Create release archive
        run: |
          ARCHIVE_NAME="yeswiki-${TAG}.zip"
          mkdir -p /tmp/release/yeswiki
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='*.config.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='.twig-cs-fixer.cache' \
            --exclude='.DS_Store' \
            . /tmp/release/yeswiki/
          cd /tmp/release
          zip -r "$GITHUB_WORKSPACE/$ARCHIVE_NAME" yeswiki/
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ARCHIVE_NAME }}
