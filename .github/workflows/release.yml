name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.4.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-26.04

    steps:
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

  build:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - name: Create release archive
        run: |
          ARCHIVE_NAME="yeswiki-${TAG}.zip"
          mkdir -p /tmp/release/yeswiki
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='phpstan' \
            --exclude='.env' \
            --exclude='*.config.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='.twig-cs-fixer.cache' \
            --exclude='.DS_Store' \
            . /tmp/release/yeswiki/
          ./binary/stamp-program-version.sh /tmp/release/yeswiki/composer.json "$TAG"
          cd /tmp/release
          zip -r "$GITHUB_WORKSPACE/$ARCHIVE_NAME" yeswiki/
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ARCHIVE_NAME }}

  binary:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: yarn install

      - uses: docker/setup-buildx-action@v4

      - name: Build the static binary
        env:
          TARGETARCH: ${{ matrix.arch }}
          COMPRESS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./binary/build-static.sh

      - name: Check the binary carries what the manifest names
        run: ./binary/check-binary.sh "binary/dist/yeswiki-linux-${{ matrix.arch }}"

      - name: Checksum
        run: |
          cd binary/dist
          sha256sum "yeswiki-linux-${{ matrix.arch }}" > "yeswiki-linux-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: yeswiki-linux-${{ matrix.arch }}
          path: |
            binary/dist/yeswiki-linux-${{ matrix.arch }}
            binary/dist/yeswiki-linux-${{ matrix.arch }}.sha256
            binary/dist/yeswiki-linux-${{ matrix.arch }}.build.json
          retention-days: 7

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            binary/dist/yeswiki-linux-${{ matrix.arch }}
            binary/dist/yeswiki-linux-${{ matrix.arch }}.sha256
            binary/dist/yeswiki-linux-${{ matrix.arch }}.build.json

      - name: Say what is still owed before this release can be installed
        run: |
          {
            echo "### yeswiki-linux-${{ matrix.arch }} is built and unsigned"
            echo
            echo 'No installed binary will accept it until it is signed offline:'
            echo
            echo '```'
            echo "gh release download ${{ env.TAG }} -p 'yeswiki-linux-${{ matrix.arch }}*'"
            echo "yeswiki sign --key ~/.yeswiki-signing/yeswiki-release.key yeswiki-linux-${{ matrix.arch }}"
            echo "gh release upload ${{ env.TAG }} yeswiki-linux-${{ matrix.arch }}.sig"
            echo '```'
            echo
            echo 'Then build the repository, which picks up the binary, its signature and its checksum.'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: binary
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-26.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: yeswiki-linux-*
          path: binary/dist
          merge-multiple: true

      - run: chmod +x binary/dist/yeswiki-linux-x86_64 binary/dist/yeswiki-linux-aarch64

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image alone, to try it before anything is pushed
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/image.Dockerfile
          platforms: linux/amd64
          load: true
          tags: yeswiki-smoke:${{ github.sha }}

      - name: Install a wiki with it and serve it, non-root on a read-only root
        run: docker/smoke-image.sh "yeswiki-smoke:${{ github.sha }}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/yeswiki/yeswiki
            name=docker.io/yeswiki/yeswiki,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          flavor: |
            latest=auto

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/image.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the image with this workflow's identity
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for repository in $(for tag in $TAGS; do echo "${tag%:*}"; done | sort -u); do
            cosign sign --yes "${repository}@${DIGEST}"
          done

      - name: Say where the image is
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### The image is published and signed"
            echo
            echo '```'
            for tag in $TAGS; do echo "$tag"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
