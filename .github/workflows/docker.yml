name: Docker Image

on:
  push:
    paths:
      # the job builds docker/dockerfile-prod, and `COPY . /var/www/html/` pulls in
      # everything else under docker/ (entrypoint.sh, nginx.conf), so watch the folder
      - docker/**
      - .github/workflows/docker.yml

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Build a Docker image able to run yeswiki
        run: docker build -f docker/dockerfile-prod -t yeswiki/yeswiki .
