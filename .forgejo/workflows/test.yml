on: [push, workflow_dispatch]
jobs:
  phpunit:
    runs-on: docker
    container:
      image: code.yeswiki.net/sylvainlehmann/php:8-2
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor
          key: ${{ forge.ref_name }}
      - run: /opt/install.sh
      - run: ./tests/tests.sh
