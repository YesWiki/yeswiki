on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: docker
    container:
      image: code.yeswiki.net/sylvainlehmann/php:8-2
      working-directory: /var/www/html
    steps:
      - uses: actions/checkout@v4
        with:
          path: /var/www/html
          show-progress: true
      - run: composer install
