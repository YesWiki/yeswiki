{{/* The replicas: the image's wiki directory with an emptyDir over each folder it writes, the configuration file from the ConfigMap, everything shared in the database and the bucket. */}}
{{- include "yeswiki.required" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yeswiki.fullname" . }}
  labels:
    {{- include "yeswiki.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "yeswiki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yeswiki.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "yeswiki.podSecurityContext" . | nindent 8 }}
      containers:
        - name: wiki
          image: {{ include "yeswiki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "yeswiki.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "yeswiki.secretName" . }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            {{- include "yeswiki.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "yeswiki.writableMounts" . | nindent 12 }}
            - name: config
              mountPath: /srv/wiki/yeswiki.config.php
              subPath: yeswiki.config.php
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "yeswiki.writableVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "yeswiki.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
