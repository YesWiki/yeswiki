{{/* Credentials, and the two keys every replica must share; the generated keys survive upgrades through lookup. */}}
{{- if not .Values.existingSecret }}
{{- include "yeswiki.required" . }}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace (include "yeswiki.fullname" .)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yeswiki.fullname" . }}
  labels:
    {{- include "yeswiki.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.database.password | b64enc | quote }}
  YESWIKI_S3_KEY: {{ .Values.storage.key | b64enc | quote }}
  YESWIKI_S3_SECRET: {{ .Values.storage.secret | b64enc | quote }}
  YESWIKI_SIGNING_KEY: {{ get $previous "YESWIKI_SIGNING_KEY" | default (randAlphaNum 64 | sha256sum | b64enc) | quote }}
  YESWIKI_BOT_GUARD_KEY: {{ get $previous "YESWIKI_BOT_GUARD_KEY" | default (randAlphaNum 64 | sha256sum | b64enc) | quote }}
  ADMIN_PASSWORD: {{ .Values.install.adminPassword | b64enc | quote }}
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
