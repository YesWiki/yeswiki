{{/* What the install Job reads, made before it: the chart's own Secret does not exist yet when a pre-install hook runs, and this one goes once the install succeeded. */}}
{{- if and .Values.install.enabled (not .Values.existingSecret) }}
{{- include "yeswiki.required" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yeswiki.fullname" . }}-install
  labels:
    {{- include "yeswiki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  DB_PASSWORD: {{ .Values.database.password | b64enc | quote }}
  YESWIKI_S3_KEY: {{ .Values.storage.key | b64enc | quote }}
  YESWIKI_S3_SECRET: {{ .Values.storage.secret | b64enc | quote }}
  ADMIN_PASSWORD: {{ .Values.install.adminPassword | b64enc | quote }}
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
